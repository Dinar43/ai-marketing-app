<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Ad Studio</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #0f172a; color: white; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .container { background: #1e293b; padding: 2.5rem; border-radius: 1.5rem; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5); width: 100%; max-width: 450px; text-align: center; border: 1px solid #334155; }
        h1 { color: #38bdf8; margin-bottom: 0.5rem; }
        select, input { width: 100%; padding: 0.8rem; margin: 10px 0; border-radius: 0.75rem; border: 1px solid #475569; background: #0f172a; color: white; box-sizing: border-box; }
        button { width: 100%; padding: 1rem; margin-top: 1rem; border-radius: 0.75rem; border: none; background: linear-gradient(to right, #3b82f6, #2563eb); color: white; font-weight: bold; cursor: pointer; transition: transform 0.2s; }
        button:hover { transform: scale(1.02); background: #3b82f6; }
        #adResult { margin-top: 1.5rem; padding: 1.5rem; border-radius: 1rem; background: #0f172a; border: 2px solid #38bdf8; min-height: 80px; }
    </style>
</head>
<body>

<div class="container">
    <h1>AI Ad Studio ✨</h1>
    <p style="color: #94a3b8;">Create high-converting ads in seconds.</p>
    
    <select id="platformSelect">
        <option value="Instagram">Instagram (Trendy)</option>
        <option value="TikTok">TikTok (Viral)</option>
        <option value="Facebook">Facebook (Professional)</option>
    </select>

    <input type="text" id="productInput" placeholder="What are you selling? (e.g. Coffee)">
    
    <button onclick="generateAd()">Generate Magic 🪄</button>

    <div id="adResult">
        <p id="adText" style="color: #cbd5e1;">Your ad will appear here...</p>
    </div>
</div>

<script>
    async function generateAd() {
        const product = document.getElementById('productInput').value;
        const platform = document.getElementById('platformSelect').value;
        const adText = document.getElementById('adText');

        if (!product) {
            alert("Please enter a product!");
            return;
        }

        adText.innerText = "⏳ Connecting to AI... please wait...";

        try {
            // Using the verified link we tested
            const url = "https://ai-marketing-app-3a8m.onrender.com/generate?product=" + encodeURIComponent(product) + "&platform=" + platform;
            
            const response = await fetch(url);
            
            if (!response.ok) throw new Error("Server error");

            const data = await response.json();
            adText.innerText = data.ad;

        } catch (error) {
            console.error(error);
            adText.innerText = "❌ Connection error. Is the backend awake on Render?";
        }
    }
</script>

</body>
</html>
