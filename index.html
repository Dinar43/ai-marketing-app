<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Ad Studio</title>
    <style>
        :root { --primary: #00d2ff; --bg: #0f172a; --card: #1e293b; --text: #f8fafc; }
        body { font-family: 'Segoe UI', sans-serif; background-color: var(--bg); color: var(--text); display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .card { background: var(--card); padding: 40px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); width: 100%; max-width: 450px; text-align: center; }
        h2 { margin-top: 0; background: linear-gradient(to right, #00d2ff, #3a7bd5); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        select, input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #334155; border-radius: 8px; background: #0f172a; color: white; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: linear-gradient(45deg, #00d2ff, #3a7bd5); border: none; border-radius: 8px; color: white; font-weight: bold; cursor: pointer; transition: 0.3s; margin-top: 10px; }
        button:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(0,210,255,0.4); }
        .secondary-btn { background: #334155; margin-top: 10px; font-size: 12px; }
        #result { margin-top: 25px; padding: 20px; background: #0f172a; border-radius: 12px; border-left: 4px solid var(--primary); display: none; text-align: left; }
        #adText { line-height: 1.6; color: #cbd5e1; white-space: pre-wrap; }
    </style>
</head>
<body>

<div class="card">
    <h2>AI Ad Studio ✨</h2>
    <p style="color: #94a3b8;">Transform your product into a viral ad campaign.</p>
    
    <label style="color: #94a3b8; font-size: 14px; display: block; text-align: left;">Target Platform:</label>
    <select id="platformSelect">
        <option value="Instagram">📸 Instagram (Trendy)</option>
        <option value="TikTok">🎬 TikTok (Energetic)</option>
        <option value="LinkedIn">💼 LinkedIn (Professional)</option>
        <option value="Facebook">👥 Facebook (Community)</option>
    </select>

    <input type="text" id="productInput" placeholder="Enter product name (e.g. Luxury Watch)">
    <button onclick="generateAd()">Generate Magic</button>

    <div id="result">
        <p id="adText"></p>
        <button class="secondary-btn" onclick="copyToClipboard()">📋 Copy Ad Text</button>
    </div>
</div>

<script>
    async function generateAd() {
        const product = document.getElementById('productInput').value;
        const platform = document.getElementById('platformSelect').value;
        const resultDiv = document.getElementById('result');
        const adText = document.getElementById('adText');

        if (!product) {
            alert("Please enter a product name!");
            return;
        }

        adText.innerText = `✨ Writing your ${platform} ad...`;
        resultDiv.style.display = "block";

        try {
            // Replace 'YOUR-BACKEND-URL' with your actual Render URL
            const response = await fetch(`https://ai-marketing-app-3a8m.onrender.com/generate?product=${encodeURIComponent(product)}&platform=${platform}`);
            adText.innerText = data.ad;
        } catch (error) {
            adText.innerText = "❌ Connection error. Is the backend running?";
        }
    }

    function copyToClipboard() {
        const text = document.getElementById('adText').innerText;
        navigator.clipboard.writeText(text);
        alert("Copied to clipboard!");
    }
</script>

</body>
</html>
