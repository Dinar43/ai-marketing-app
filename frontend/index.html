<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Ad Studio</title>
    <style>
        :root { --primary: #00d2ff; --bg: #0f172a; --card: #1e293b; --text: #f8fafc; }
        body { font-family: 'Segoe UI', sans-serif; background-color: var(--bg); color: var(--text); display: flex; justify-content: center; padding: 50px; margin: 0; }
        .card { background: var(--card); padding: 40px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); width: 450px; border: 1px solid #334155; }
        h2 { margin-top: 0; background: linear-gradient(to right, #00d2ff, #3a7bd5); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-size: 28px; }
        input { width: 100%; padding: 12px; margin: 15px 0; border: 1px solid #334155; border-radius: 8px; background: #0f172a; color: white; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: linear-gradient(45deg, #00d2ff, #3a7bd5); color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; transition: transform 0.2s; }
        button:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(0,210,255,0.4); }
        .secondary-btn { background: #334155; margin-top: 10px; font-size: 12px; }
        #result { margin-top: 25px; padding: 20px; background: #0f172a; border-radius: 12px; border-left: 4px solid var(--primary); display: none; position: relative; }
        #adText { line-height: 1.6; color: #cbd5e1; }
    </style>
</head>
<body>

<div class="card">
    <h2>AI Ad Studio ✨</h2>
    <p style="color: #94a3b8;">Transform your product into a viral ad campaign.</p>
    
    <input type="text" id="productInput" placeholder="Enter product name...">
    <button onclick="generateAd()">Generate Magic</button>

    <div id="result">
        <p id="adText"></p>
        <button class="secondary-btn" onclick="copyToClipboard()">📋 Copy Ad Text</button>
    </div>
</div>

<script>
    async function generateAd() {
        const product = document.getElementById('productInput').value;
        const resultDiv = document.getElementById('result');
        const adText = document.getElementById('adText');

        if (!product) { alert("Please enter a product name!"); return; }

        adText.innerText = "Consulting the AI experts...";
        resultDiv.style.display = "block";

        try {
            const response = await fetch(`http://127.0.0.1:8000/generate?product=${product}`);
            const data = await response.json();
            adText.innerText = data.ad;
        } catch (error) {
            adText.innerText = "⚠️ Kitchen is closed! Make sure main.py is running.";
        }
    }

    function copyToClipboard() {
        const text = document.getElementById('adText').innerText;
        navigator.clipboard.writeText(text);
        alert("Ad copied to clipboard! 🚀");
    }
</script>

</body>
</html>
